name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Builds .output/firefox-mv3 and the AMO sources zip that signing uploads.
      - name: Build and zip
        run: npm run zip

      - name: Lint
        run: npm run lint

      # web-ext sign --source-dir .output/firefox-mv3 --upload-source-code <sources zip>
      - name: Sign and upload to AMO
        run: npm run sign:listed
        env:
          WEB_EXT_API_KEY: ${{ secrets.MOZILLA_ADDONS_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.MOZILLA_ADDONS_JWT_SECRET }}
